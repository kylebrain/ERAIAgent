<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="api-endpoint" content="https://8vlhus0qmg.execute-api.us-east-1.amazonaws.com/prod" />
  <title>Elden Ring AI Guide</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<header>
  <h1>&#9876; Elden Ring AI Guide</h1>
  <span class="subtitle">Powered by Amazon Bedrock &middot; Fextralife wiki &middot; game map data</span>
  <button id="mute-toggle" class="header-btn" title="Toggle voice playback">&#128264; Voice on</button>
  <button id="test-toggle" class="header-btn test-mode" title="Toggle test mode (canned quotes)">Test mode</button>
  <button id="gear-toggle" class="header-btn" title="Settings">&#9881;</button>
</header>

<div id="settings-panel"></div>

<div id="config-banner">
  &#9888; API endpoint not configured. Edit <code>web/index.html</code> and set the
  <code>api-endpoint</code> meta tag to your API Gateway URL from the CloudFormation outputs.
</div>

<div id="chat"></div>

<div id="input-area">
  <button id="mic" title="Click to start/stop recording (or press the configured keybind)">&#127908;</button>
  <textarea id="question" placeholder="Ask about enemies, items, locations, bosses..." rows="1"></textarea>
  <button id="send">Ask</button>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
